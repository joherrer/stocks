{% extends "layout.html" %}

{% block title %}
    Cash
{% endblock %}

{% block main %}

    <h2>Cash: {{ cash | usd }}</h2>

    <div class="container mt-4">
        <form action="/cash" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="add_cash" placeholder="Insert amount" type="number" min="0.01" step="0.01" required>
            </div>
            <div class="mb-3">
                <button class="btn btn-primary" type="submit">Add Cash</button>
            </div>
        </form>
    </div>

{% endblock %}
